global_templates:
  - template: display/live_preview.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/client/preview/DisplayLivePreview.java"

templates:
  - template: armor.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/item/@NAMEItem.java"
  - template: fashion_item_worn_layer.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/client/renderer/item/@NAMEFashionLayer.java"
    condition: simpleItemWearable

# Helmet item model
  - template: json/item.json.ftl
    writer: json
    variables: "item=helmet"
    condition:
      - "shouldGenerateHelmetItem()"
      - "hasHelmetNormalModel()"
    name: "@MODASSETSROOT/models/item/@registryname_helmet.json"
  - template: json/tool.json.ftl
    writer: json
    variables: "item=helmet"
    condition:
      - "shouldGenerateHelmetItem()"
      - "hasHelmetToolModel()"
    name: "@MODASSETSROOT/models/item/@registryname_helmet.json"
  - template: json/item_cmodel.json.ftl
    writer: json
    variables: "item=helmet"
    condition:
      - "shouldGenerateHelmetItem()"
      - "helmetItemRenderType #= 1"
    name: "@MODASSETSROOT/models/item/@registryname_helmet.json"
  - template: json/item_cmodel_obj.json.ftl
    writer: json
    condition:
      - "shouldGenerateHelmetItem()"
      - "helmetItemRenderType #= 2"
    variables: "item=helmet"
    name: "@MODASSETSROOT/models/item/@registryname_helmet.json"

# Body item model
  - template: json/item.json.ftl
    writer: json
    variables: "item=body"
    condition:
      - "shouldGenerateBodyItem()"
      - "hasBodyNormalModel()"
    name: "@MODASSETSROOT/models/item/@registryname_chestplate.json"
  - template: json/tool.json.ftl
    writer: json
    variables: "item=body"
    condition:
      - "shouldGenerateBodyItem()"
      - "hasBodyToolModel()"
    name: "@MODASSETSROOT/models/item/@registryname_chestplate.json"
  - template: json/item_cmodel.json.ftl
    writer: json
    variables: "item=body"
    condition:
      - "shouldGenerateBodyItem()"
      - "bodyItemRenderType #= 1"
    name: "@MODASSETSROOT/models/item/@registryname_chestplate.json"
  - template: json/item_cmodel_obj.json.ftl
    writer: json
    condition:
      - "shouldGenerateBodyItem()"
      - "bodyItemRenderType #= 2"
    variables: "item=body"
    name: "@MODASSETSROOT/models/item/@registryname_chestplate.json"

# Leggings item model
  - template: json/item.json.ftl
    writer: json
    variables: "item=leggings"
    condition:
      - "shouldGenerateLeggingsItem()"
      - "hasLeggingsNormalModel()"
    name: "@MODASSETSROOT/models/item/@registryname_leggings.json"
  - template: json/tool.json.ftl
    writer: json
    variables: "item=leggings"
    condition:
      - "shouldGenerateLeggingsItem()"
      - "hasLeggingsToolModel()"
    name: "@MODASSETSROOT/models/item/@registryname_leggings.json"
  - template: json/item_cmodel.json.ftl
    writer: json
    variables: "item=leggings"
    condition:
      - "shouldGenerateLeggingsItem()"
      - "leggingsItemRenderType #= 1"
    name: "@MODASSETSROOT/models/item/@registryname_leggings.json"
  - template: json/item_cmodel_obj.json.ftl
    writer: json
    condition:
      - "shouldGenerateLeggingsItem()"
      - "leggingsItemRenderType #= 2"
    variables: "item=leggings"
    name: "@MODASSETSROOT/models/item/@registryname_leggings.json"

# Boots item model
  - template: json/item.json.ftl
    writer: json
    variables: "item=boots"
    condition:
      - "shouldGenerateBootsItem()"
      - "hasBootsNormalModel()"
    name: "@MODASSETSROOT/models/item/@registryname_boots.json"
  - template: json/tool.json.ftl
    writer: json
    variables: "item=boots"
    condition:
      - "shouldGenerateBootsItem()"
      - "hasBootsToolModel()"
    name: "@MODASSETSROOT/models/item/@registryname_boots.json"
  - template: json/item_cmodel.json.ftl
    writer: json
    variables: "item=boots"
    condition:
      - "shouldGenerateBootsItem()"
      - "bootsItemRenderType #= 1"
    name: "@MODASSETSROOT/models/item/@registryname_boots.json"
  - template: json/item_cmodel_obj.json.ftl
    writer: json
    condition:
      - "shouldGenerateBootsItem()"
      - "bootsItemRenderType #= 2"
    variables: "item=boots"
    name: "@MODASSETSROOT/models/item/@registryname_boots.json"

tags:
  - tag: ITEMS:minecraft:head_armor
    condition: shouldGenerateHelmetItem()
    entry: "CUSTOM:@NAME.helmet"
  - tag: ITEMS:minecraft:chest_armor
    condition: shouldGenerateBodyItem()
    entry: "CUSTOM:@NAME.body"
  - tag: ITEMS:minecraft:leg_armor
    condition: shouldGenerateLeggingsItem()
    entry: "CUSTOM:@NAME.legs"
  - tag: ITEMS:minecraft:foot_armor
    condition: shouldGenerateBootsItem()
    entry: "CUSTOM:@NAME.boots"

localizationkeys:
  - key: item.@modid.@registryname_helmet
    mapto: helmetName
    condition: shouldGenerateHelmetItem()
  - key: item.@modid.@registryname_chestplate
    mapto: bodyName
    condition: shouldGenerateBodyItem()
  - key: item.@modid.@registryname_leggings
    mapto: leggingsName
    condition: shouldGenerateLeggingsItem()
  - key: item.@modid.@registryname_boots
    mapto: bootsName
    condition: shouldGenerateBootsItem()
