plugins {
    id 'fabric-loom' version '1.14.10'
}

base {
    archivesName = 'modid'
}
version = '1.0.0'
group = 'com.yourname.modid'
actualmodid = '${modid}'

loom {
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = actualmodid + ".refmap.json"
    }
    if (file("src/main/resources/${modid}.accesswidener").exists())
        accessWidenerPath = file("src/main/resources/${modid}.accesswidener")
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:1.20.1"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.14.21"

    //Fabric api
    modImplementation "net.fabricmc.fabric-api:fabric-api:${generator.getGeneratorBuildFileVersion()}+1.20.1"

    // Embedded OBJ loader. Players do not need to install it separately.
    modImplementation "maven.modrinth:ajFw7VkX:dYbsug6P"
    include "maven.modrinth:ajFw7VkX:dYbsug6P"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from "LICENSE"
}

apply from: 'mcreator.gradle'
